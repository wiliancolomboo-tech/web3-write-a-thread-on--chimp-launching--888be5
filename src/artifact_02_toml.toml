[package]
name = "chimp_launch"
version = "0.1.0"
description = "Enterprise $CHIMP Launchpad & Metaplex Core Integration Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chimp_launch"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
mpl-core = { version = "0.7.0" }
solana-program = "1.18.26"