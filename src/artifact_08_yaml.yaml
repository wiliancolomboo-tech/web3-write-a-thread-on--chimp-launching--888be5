version: '3.8'

services:
  chimp-telemetry-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp-metaplex-worker
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - CHIMP_PROGRAM_ID=CH1MPy8zV4aRkR1XbNn4PqZ6yH7mJ9wQ2L8tV3kU1s9
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"