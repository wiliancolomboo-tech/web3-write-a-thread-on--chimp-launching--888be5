[package]
name = "chimp_launch_engine"
version = "0.1.0"
description = "Production-grade Metaplex Core and $CHIMP Hybrid Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chimp_launch_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
mpl-core = { version = "0.7.0" }
solana-program = "=1.18.26"