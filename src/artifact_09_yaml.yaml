version: '3.8'

services:
  chimp-core-engine:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - AUTHORITY_KEYPAIR_JSON=${AUTHORITY_KEYPAIR_JSON}
      - DISCORD_SLACK_WEBHOOK=${DISCORD_SLACK_WEBHOOK}
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"