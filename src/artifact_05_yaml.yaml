version: "3.8"

services:
  chimp-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimp-launch-service
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - KEYPAIR_PATH=/app/secrets/deployer-keypair.json
      - CHIMP_MINT=CHMPc7Q8oPz1kPjF78q5i2qNGePBNsCqM86gL9FmH94x
      - DISCORD_SLACK_WEBHOOK=https://api.example.com/webhooks/alerts/placeholder
      - NODE_ENV=production
    volumes:
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8080:8080"