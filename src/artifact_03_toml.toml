[package]
name = "chimp-launch"
version = "0.1.0"
description = "$CHIMP Launchpad Engine on Metaplex Core"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chimp_launch"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
mpl-core = "0.7.1"
solana-program = "1.18.26"