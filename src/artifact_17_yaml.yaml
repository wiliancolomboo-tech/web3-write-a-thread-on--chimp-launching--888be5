version: "3.8"

services:
  chimp-mint-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC=${SOLANA_RPC:-https://api.devnet.solana.com}
      - PROGRAM_ID=Ch1mpLaunchEng1ne11111111111111111111111111
      - DISCORD_OR_SLACK_WEBHOOK=${DISCORD_OR_SLACK_WEBHOOK}
    command: ["npm", "run", "monitor"]